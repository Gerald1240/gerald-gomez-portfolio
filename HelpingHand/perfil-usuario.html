<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Perfil del Cliente</title>

    <script type="module" src="perfil-usuario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="perfil.css" />
</head>
<body>
    <header class="header">
        <nav>
            <div class="nav__bar">
                <div class="logo">
                    <a href="index2.html"><img src="assets/logo.png" alt="logo" /></a>
                </div>
            </div>
            <ul class="nav__links" id="nav-links">
                <li><a href="index2.html">Inicio</a></li>
                <li><a href="index2.html#about">Nosotros</a></li>
                <li><a href="index2.html#service">Servicios</a></li>
                <li><a href="index2.html#explore">Explorar</a></li>
                <li><a href="index2.html#contact">Contacto</a></li>
            </ul>
            <a href="login.html" id="logout-link">
                <button class="btn1">Cerrar Sesión</button>
            </a>
        </nav>
    </header>

    <main class="perfil-container">
        <h1>Perfil del Cliente</h1>

        <!-- Imagen de perfil -->
        <div class="photo-container">
            <img src="assets/user.jpg" alt="Imagen de Perfil" id="profile-img" class="photo"/>
            <input type="file" id="foto-perfil" name="foto-perfil" accept="image/*" />
        </div>

        <form id="perfil-form">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Número de teléfono" required />
            </div>

            <div class="form-group">
                <label for="direccion">Dirección (calle y número)</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle y número" required />
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required />
            </div>

            <div class="form-group">
                <label for="distrito">Distrito</label>
                <input type="text" id="distrito" name="distrito" placeholder="Distrito" required />
            </div>

            <div class="form-group">
                <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required />
            </div>

            <div class="form-group">
                <label for="genero">Género</label>
                <select id="genero" name="genero" required>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="preferencias">Preferencias de Contacto</label>
                <select id="preferencias" name="preferencias" required>
                    <option value="Correo">Correo</option>
                    <option value="SMS">SMS</option>
                    <option value="Llamadas">Llamadas</option>
                </select>
            </div>            

            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </form>
    </main>

    <script>
      // Manejo del formulario de perfil
      document.getElementById("perfil-form").addEventListener("submit", function(event) {
        event.preventDefault();
        Swal.fire({
          icon: 'success',
          title: 'Perfil Actualizado',
          text: 'Tu perfil ha sido actualizado con éxito.',
        });
      });

      // Manejo de la imagen de perfil
      const profileImg = document.getElementById('profile-img');
      const fileInput = document.getElementById('foto-perfil');
    
      fileInput.addEventListener('change', function (event) {
        const file = event.target.files[0];
        
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (e) {
            profileImg.src = e.target.result;
          };
          reader.readAsDataURL(file);
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Archivo no válido',
            text: 'Por favor selecciona una imagen válida.',
          });
        }
      });
    </script>    
</body>
</html>
