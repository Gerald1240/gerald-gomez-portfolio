    <!-- js code -->
    <script>
        const container = document.getElementById('container');
        const overlayCon = document.getElementById('overlayCon');
        const overlayBtn = document.getElementById('overlayBtn');
        
        // Función para centrar el texto dentro del botón
        function centerButtonText(button) {
            // Aplicar estilos directamente usando JS
            button.style.display = "flex";
            button.style.justifyContent = "center";
            button.style.alignItems = "center";
        }
    
        // Aplicar la clase de escala y centrar el texto del botón
        overlayBtn.addEventListener('click', () => {
            container.classList.toggle('right-panel-active');
    
            // Remover clase y volver a añadirla para animación
            overlayBtn.classList.remove('btnScaled');
            window.requestAnimationFrame(() => {
                overlayBtn.classList.add('btnScaled');
            });
    
            // Centrar el texto del botón después de la animación
            centerButtonText(overlayBtn);
        });
    
        // Asegurarse de que el texto esté centrado al cargar la página
        centerButtonText(overlayBtn);
    </script>
    
</body>
