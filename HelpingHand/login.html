<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Iniciar Sesión || Registrarse</title>

    <script type="module" src="firebaseconect.js"></script>
    <script type="module" src="signup.js"></script>
    <script type="module" src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="form-styles.css" />
  </head>
  <body>
    <header class="header">
      <nav>
        <div class="nav__bar">
          <div class="logo">
            <a href="index.html"><img src="assets/logo.png" alt="logo" /></a>
          </div>
          <div class="nav__menu__btn" id="menu-btn">
            <i class="ri-menu-line"></i>
          </div>
        </div>
        <ul class="nav__links" id="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#about">Nosotros</a></li>
          <li><a href="index.html#service">Servicios</a></li>
          <li><a href="index.html#explore">Explorar</a></li>
          <li><a href="index.html#contact">Contacto</a></li>
        </ul>
        <div class="button-container">
          <a href="login.html" class="btn-login">Login</a>
          <a href="login.html" class="btn1">Registrarse</a>
        </div>
      </nav>
    </header>

    <div class="container" id="container">
      <!-- Formulario de Registro -->
      <div class="form-container sign-up-container">
        <form id="register-form">
          <h1>Crear Cuenta</h1>
          <div class="social-container">
          </div>
          <span>o usa tu correo para registrarte</span>
          <div class="infield">
            <input type="text" id="register-name" placeholder="Nombre" required />
            <label></label>
          </div>
          <div class="infield">
            <input type="email" id="register-email" placeholder="Correo" name="email" required />
            <label></label>
          </div>
          <div class="infield">
            <input type="password" id="register-password" placeholder="Contraseña" name="password" required />
            <label></label>
          </div>
          <!-- Selector de tipo de cuenta -->
          <div class="infield">
            <select id="account-type" name="accountType" required>
              <option value="" disabled selected>Tipo de Cuenta</option>
              <option value="Usuario">Usuario</option>
              <option value="Trabajador">Trabajador</option>
            </select>
            <label></label>
          </div>
          <!-- Botón de registro -->
          <button type="submit">Registrarse</button>
        </form>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <div class="form-container sign-in-container">
        <form id="login-form">
          <h1>Iniciar Sesión</h1>
          <div class="social-container">
          </div>
          <span>o usa tu correo</span>
          <div class="infield">
            <input type="email" id="login-email" placeholder="Correo" name="email" required />
            <label></label>
          </div>
          <div class="infield">
            <input type="password" id="login-password" placeholder="Contraseña" name="password" required />
            <label></label>
          </div>
          <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
          <button type="submit">Iniciar Sesión</button>
        </form>
      </div>

      <!-- Sección de Overlay -->
      <div class="overlay-container" id="overlayCon">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>¿Ya tienes una cuenta?</h1>
            <p>Solo ingresa tus datos.</p>
            <button id="signIn">Iniciar Sesión</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h1>¡Hola!, ¿Eres Nuevo?</h1>
            <p>Ingresa tus datos para empezar.</p>
            <button id="signUp">Regístrate</button>
          </div>
        </div>
      </div>
    </div>

    <!-- js code -->
    <script>
      const container = document.getElementById('container');
      const signInBtn = document.getElementById('signIn');
      const signUpBtn = document.getElementById('signUp');
    
      // Animaciones del panel
      signInBtn.addEventListener('click', () => {
        container.classList.remove('right-panel-active');
      });
    
      signUpBtn.addEventListener('click', () => {
        container.classList.add('right-panel-active');
      });
    </script>
  </body>
</html>
