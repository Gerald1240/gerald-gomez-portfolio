<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Perfil de Usuario</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="perfil.css" />
</head>
<body>
    <header class="header">
        <nav>
            <div class="nav__bar">
                <div class="logo">
                    <a href="index1.html"><img src="assets/logo.png" alt="logo" /></a>
                </div>
            </div>
            <ul class="nav__links" id="nav-links">
                <li><a href="index1.html">Inicio</a></li>
                <li><a href="index1.html#about">Nosotros</a></li>
                <li><a href="index1.html#service">Servicios</a></li>
                <li><a href="index1.html#explore">Explorar</a></li>
                <li><a href="index1.html#contact">Contacto</a></li>
            </ul>
            <a href="login.html" id="logout-link">
                <button class="btn1">Cerrar Sesión</button>
            </a>
        </nav>
    </header>

    <main class="perfil-container">
        <h1>Perfil de Trabajador</h1>

        <!-- Imagen de perfil -->
        <div class="photo-container">
            <img src="assets/user.jpg" alt="Imagen de Perfil" id="profile-img" class="photo"/>
            <input type="file" id="foto-perfil" name="foto-perfil" accept="image/*" />
        </div>

        <form id="perfil-form">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Número de teléfono" required />
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Dirección de domicilio" />
            </div>

            <div class="form-group">
                <label for="biografia">Descripción Personal/Bio</label>
                <textarea id="biografia" name="biografia" placeholder="Escribe algo sobre ti"></textarea>
            </div>

            <div class="form-group">
                <label for="especialidad">Especialidad/Área de Trabajo</label>
                <input type="text" id="especialidad" name="especialidad" placeholder="Ej. Electricista, Plomero" />
            </div>

            <div class="form-group">
                <label for="experiencia">Años de Experiencia</label>
                <input type="text" id="experiencia" name="experiencia" placeholder="Años de experiencia" />
            </div>

            <div class="form-group">
                <label for="certificaciones">Certificaciones o Documentos</label>
                <input type="file" id="certificaciones" name="certificaciones" accept="application/pdf, image/*" />
            </div>

            <div class="form-group">
                <label for="horario">Horario de Disponibilidad</label>
                <input type="text" id="horario" name="horario" placeholder="Ej. 8:00 AM - 6:00 PM" />
            </div>

            <!-- Nuevo campo: Precio mínimo por trabajo -->
            <div class="form-group">
                <label for="precio-minimo">Precio Mínimo por Trabajo</label>
                <select id="precio-minimo" name="precio-minimo" required>
                    <option value="20">20 soles</option>
                    <option value="30">30 soles</option>
                    <option value="40">40 soles</option>
                    <option value="50">50 soles</option>
                    <option value="60">60 soles</option>
                    <option value="70">70 soles</option>
                    <option value="80">80 soles</option>
                    <option value="90">90 soles</option>
                    <option value="100">100 soles</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </form>
    </main>  

    <script>
      window.addEventListener('DOMContentLoaded', function() {
          const profileImg = document.getElementById('profile-img');
          const fileInput = document.getElementById('foto-perfil');
    
          fileInput.addEventListener('change', function (event) {
              const file = event.target.files[0];
              if (file && file.type.startsWith('image/')) {
                  const reader = new FileReader();
                  reader.onload = function (e) {
                      profileImg.src = e.target.result;
                  };
                  reader.readAsDataURL(file);
              } else {
                  Swal.fire({
                      icon: 'error',
                      title: 'Archivo no válido',
                      text: 'Por favor selecciona una imagen válida.',
                  });
              }
          });
      });
    </script>   
    <script type="module" src="perfil.js"></script> 
</body>
</html>
